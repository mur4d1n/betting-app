[tool.poetry]
name = "bet-maker"
version = "0.1.0"
description = "Small API implemnetation for betting service"
authors = ["mur4d1n <mur4d1n@yandex.ru>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
alembic = "1.15.2"
asyncpg = "0.30.0"
fastapi = "0.115.12"
sqlalchemy = "2.0.40"
pydantic = "2.11.3"
uvicorn = "0.34.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
flake8 = "^4.0"
mypy = "^0.910"
black = "^23.0"
coverage = {version = "^6.0", extras = ["toml"]}

[tool.black]
line-length = 88
target-version = ['py310']

[tool.flake8]
max-line-length = 88
select = ["E", "W", "F", "C"]
ignore = ["E501", "W503"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
